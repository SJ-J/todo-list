spring:
  application:
    name: todo-list
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/todolist?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: 1111
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# 공휴일 API URL (인증키는 application-local.yaml)
holiday:
  api:
    service-key: ${HOLIDAY_SERVICE_KEY:}
    url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo
